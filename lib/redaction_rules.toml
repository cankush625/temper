# Redaction rules — the single list of patterns scrubbed from anything Temper writes to disk
# (command receipts, review receipts). Each entry is one named regex; a match is replaced with
# [REDACTED:<category>:<name>]. Add a rule here and nowhere else.
#
# Over-redaction is the safe side: a receipt keeps the true exit code and the sha256 of the raw
# output, so blanking a false positive loses nothing the gate relies on.
#
# `validate` (optional) names a check a match must also pass before it counts — see lib/redact.py.

[[secret]]
name = "private_key_block"
pattern = '''-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----[\s\S]*?(?:-----END [A-Z0-9 ]*PRIVATE KEY-----|\Z)'''

[[secret]]
name = "aws_access_key_id"
pattern = '''\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'''

[[secret]]
name = "aws_secret_access_key"
pattern = '''(?i)aws_secret_access_key["']?\s*[=:]\s*["']?[A-Za-z0-9/+=]{40}'''

[[secret]]
name = "github_token"
pattern = '''\bgh[pousr]_[A-Za-z0-9]{36,}\b|\bgithub_pat_[A-Za-z0-9_]{22,}'''

[[secret]]
name = "slack_token"
pattern = '''\bxox[abposr]-[A-Za-z0-9-]{10,}'''

[[secret]]
name = "llm_api_key"
pattern = '''\bsk-(?:ant-|proj-)?[A-Za-z0-9_-]{20,}'''

[[secret]]
name = "datadog_key"
pattern = '''(?i)\b(?:dd|datadog)[_-]?(?:api|app(?:lication)?)[_-]?key["']?\s*[=:]\s*["']?[a-f0-9]{32,40}\b'''

[[secret]]
name = "jwt"
pattern = '''\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'''

[[secret]]
name = "bearer_token"
pattern = '''(?i)\bbearer\s+[A-Za-z0-9._~+/=-]{16,}'''

[[secret]]
name = "url_credentials"
pattern = '''(?i)\b[a-z][a-z0-9+.-]*://[^\s/:@]+:[^\s/@]+@'''

[[secret]]
name = "credential_assignment"
pattern = '''(?i)\b[\w.-]*(?:password|passwd|secret|token|api[_-]?key|access[_-]?key)["']?\s*[:=]\s*["']?[^\s"',;]{8,}'''

[[pii]]
name = "email"
# Not after ':' or '/', so the password in user:pass@host is left to url_credentials and the
# host stays readable.
pattern = '''(?<![\w.%+:/-])[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}\b'''

[[pii]]
name = "phone"
pattern = '''(?<![\w.-])(?:\+\d{1,3}[-.\s]?)?\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}(?![\w-])'''

[[pii]]
name = "card_number"
pattern = '''(?<!\d)(?:\d[ -]?){12,18}\d(?!\d)'''
# 13-19 digit runs that fail the Luhn checksum (ms timestamps, numeric ids) are left alone.
validate = "luhn"
