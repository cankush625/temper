# Temper config template — AWS SAM / CloudFormation.
# Paste the [project] / [commands] below under '## Temper' in CLAUDE.md.
#
# Credential-free verify: compile the Lambda handlers and lint the template. `sam validate
# --lint` runs cfn-lint, which is bundled in the SAM CLI and works offline. `sam build`,
# `deploy`, and live change-sets need cloud credentials — keep those OUT of the default gate.

[project]
name = "my-sam-app"
kind = "sam"

[commands]
baseline = [
    "python3 -m compileall -q src",
    "sam validate --lint -t template.yaml",
]
verify = [
    "python3 -m compileall -q src",
    "sam validate --lint -t template.yaml",
]
review = "thermo-nuclear"
