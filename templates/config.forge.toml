# Per-project harness config for forge (Terraform IaC).
# Copy to <project>/.harness/config.toml. The engine reads only [commands].
#
# forge's verify surface is credential-FREE: `just validate dev` runs
# `terraform init -backend=false && terraform validate` (no AWS), and pre-commit
# runs terraform_fmt + terraform_validate. `just plan dev` needs AWS SSO and hits
# live AWS, so it is an opt-in escalation, never a default gate.

[project]
name = "forge"
kind = "terraform"

[commands]
# Run at session start through capture.py to confirm a green starting point.
baseline = [
    "just fmt",
    "just validate dev",
    "pre-commit run --all-files",
]

# Run after a change, through capture.py, to earn a passing receipt.
verify = [
    "just validate dev",
    "pre-commit run --all-files",
]

# Credentialed escalation — only when a task truly needs a real plan and you have
# run `just aws-login dev`. Not part of the default gate.
plan_optional = [
    "just aws-login dev",
    "just plan dev",
]

review = "thermo-nuclear"
